services:
  php:
    build:
      context: .
      dockerfile: dev/php/Dockerfile
      args:
        UID: "${UID}"
        GID: "${GID}"
    user: "${UID}:${GID}"
    environment:
      HOME: /home/app
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ffxiv
      MYSQL_USER: ffxiv
      MYSQL_PASSWORD: Testing99!
      MYSQL_ROOT_PASSWORD: Testing99!
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
